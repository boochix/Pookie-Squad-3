<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sensor Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f4f4f4; }
  #dashboard { display:flex; flex-wrap:wrap; justify-content:space-around; padding:10px; }
  .card { background:white; border-radius:10px; padding:10px; margin:10px; box-shadow:0 2px 5px rgba(0,0,0,0.2);}
  canvas { background:#fff; border-radius:10px; }
  #map { height:400px; width:100%; border-radius:10px; }
</style>
</head>
<body>

<div id="dashboard">
  <div class="card" style="flex:1 1 600px;">
    <h3>Acceleration (m/s²)</h3>
    <canvas id="accelChart"></canvas>
  </div>
  <div class="card" style="flex:1 1 600px;">
    <h3>Speed (m/s)</h3>
    <canvas id="speedChart"></canvas>
  </div>
  <div class="card" style="flex:1 1 1000px;">
    <h3>GPS Map</h3>
    <div id="map"></div>
  </div>
</div>

<script>
let accelData = {Ax:[], Ay:[], Az:[], labels:[]};
let speedData = {speed:[], labels:[]};
const MAX_POINTS = 100;  // points shown on graphs

// Charts
const accelChart = new Chart(document.getElementById('accelChart'), {
    type:'line',
    data:{labels:[], datasets:[
      {label:'Ax', borderColor:'red', data:[]},
      {label:'Ay', borderColor:'green', data:[]},
      {label:'Az', borderColor:'blue', data:[]}
    ]},
    options:{animation:false, scales:{x:{display:false}}}
});

const speedChart = new Chart(document.getElementById('speedChart'), {
    type:'line',
    data:{labels:[], datasets:[{label:'Speed', borderColor:'orange', data:[]}]},
    options:{animation:false, scales:{x:{display:false}}}
});

// Map
const map = L.map('map').setView([12.86164141, 77.66460835], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19
}).addTo(map);
const polyline = L.polyline([], {color:'blue'}).addTo(map);
let lastGps = null;

// Speed calculation with GPS + acceleration smoothing
let smoothSpeed = 0;
const alpha = 0.3; // GPS smoothing
let lastTime = null;

function updateDashboard(){
    fetch('http://10.1.16.205:8080/sensors.json')
    .then(res=>res.json())
    .then(sensors=>{
        // Acceleration
        const la = sensors.lin_accel.data.slice(-1)[0];
        const t = la[0];
        const vals = la[1];
        ['Ax','Ay','Az'].forEach((axis,i)=>{
            accelData[axis].push(vals[i]);
            if(accelData[axis].length>MAX_POINTS) accelData[axis].shift();
        });
        accelData.labels.push('');
        if(accelData.labels.length>MAX_POINTS) accelData.labels.shift();

        accelChart.data.labels = accelData.labels;
        accelChart.data.datasets.forEach((ds,i)=>{ds.data = accelData[['Ax','Ay','Az'][i]]});
        accelChart.update();
    });

    fetch('http://10.1.16.205:8080/gps.json')
    .then(res=>res.json())
    .then(gps=>{
        const lat = gps.gps.latitude;
        const lng = gps.gps.longitude;
        const ts = Date.now();

        // Map update
        polyline.addLatLng([lat,lng]);
        map.setView([lat,lng], map.getZoom());

        // Speed calculation using GPS + smoothing
        if(lastGps){
            const R = 6371000;
            const dLat = (lat-lastGps.lat)*Math.PI/180;
            const dLon = (lng-lastGps.lng)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lastGps.lat*Math.PI/180)*Math.cos(lat*Math.PI/180)*Math.sin(dLon/2)**2;
            const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            let distance = R*c;
            const dt = (ts-lastTime)/1000;
            let gpsSpeed = dt>0 ? distance/dt : 0;
            if(distance<0.5) gpsSpeed=0; // ignore jitter
            smoothSpeed = alpha*gpsSpeed + (1-alpha)*smoothSpeed;
        }

        lastGps = {lat,lng};
        lastTime = ts;

        speedData.speed.push(smoothSpeed);
        speedData.labels.push('');
        if(speedData.speed.length>MAX_POINTS){ speedData.speed.shift(); speedData.labels.shift(); }

        speedChart.data.labels = speedData.labels;
        speedChart.data.datasets[0].data = speedData.speed;
        speedChart.update();
    })
    .catch(err=>console.log(err));
}

setInterval(updateDashboard, 200); // update every 200ms
</script>

</body>
</html>
